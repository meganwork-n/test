<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITeFM Attendance Tracker - Who is not in office</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1c2333;
    --muted: #6b7488;
    --line: #e3e7ef;
    --accent: #2f6fed;
    --green: #2e7d4f;
    --green-bg: #e8f5ee;
    --red: #d64545;
    --today: #fff6d8;
    --off: #f2f3f6;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(20,30,60,.08), 0 6px 20px rgba(20,30,60,.06);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif; background: var(--bg); color: var(--ink); }

  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; display: flex; align-items: center; gap: 8px; }
  header .sub { color: var(--muted); font-size: 12.5px; }
  .badge-live { font-size: 10.5px; color: var(--green); background: var(--green-bg); border-radius: 999px; padding: 2px 8px; font-weight: 700; }
  header .spacer { flex: 1; }

  .btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  .btn:hover { background: #f0f3fa; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn.icon { padding: 6px 12px; font-size: 16px; line-height: 1; }

  .roster { background: var(--card); border-bottom: 1px solid var(--line); padding: 10px 20px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .roster .label { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-right: 4px; }
  .member-pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600; color: #fff; }
  .member-pill .x { border: none; background: none; color: inherit; opacity: .5; cursor: pointer; font-size: 13px; padding: 0 2px; }
  .member-pill .x:hover { opacity: 1; color: var(--red); }
  .add-member { display: inline-flex; gap: 6px; }
  .add-member input { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; width: 170px; font-family: inherit; }
  .add-member input:focus { outline: 2px solid #bcd0fb; border-color: var(--accent); }
  .add-member button { border: none; background: var(--green); color: #fff; border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .add-member button:hover { filter: brightness(1.1); }

  main { max-width: 1280px; margin: 16px auto; padding: 0 16px; display: grid; grid-template-columns: 1fr 320px; gap: 16px; }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }

  .cal-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .cal-head h2 { margin: 0; font-size: 17px; min-width: 150px; }
  .cal-head .stat { font-size: 12.5px; color: var(--muted); }
  .cal-head .stat b { color: var(--ink); }

  .grid { display: grid; grid-template-columns: repeat(5, 1fr); }
  .dow { padding: 8px 6px; text-align: center; font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--line); }
  .day { min-height: 110px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 6px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
  .day:nth-child(5n) { border-right: none; }
  .day:hover { background: #eef3ff; }
  .day.today { background: var(--today); }
  .day.selected { outline: 2px solid var(--accent); outline-offset: -2px; }
  .day.hol { background: var(--off); cursor: default; }
  .day.hol:hover { background: var(--off); }
  .day .num { font-size: 12.5px; font-weight: 700; align-self: flex-end; }
  .day.today .num { background: var(--accent); color: #fff; border-radius: 50%; width: 21px; height: 21px; display: grid; place-items: center; }
  .hol-label { font-size: 10.5px; color: var(--muted); font-style: italic; padding: 2px 0; }
  .incow-count { font-size: 11px; font-weight: 800; border-radius: 6px; padding: 2px 6px; align-self: flex-start; }
  .incow-count.ok { color: var(--green); background: var(--green-bg); }
  .incow-count.warn { color: var(--red); background: #fbeaea; }
  .who-chip { font-size: 10.5px; border-radius: 4px; padding: 1.5px 6px; color: #fff; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .more { font-size: 10.5px; color: var(--muted); }
  .empty-hint { padding: 24px; color: var(--muted); font-size: 13.5px; text-align: center; }

  aside { display: flex; flex-direction: column; gap: 16px; }
  .panel { padding: 16px; }
  .panel h3 { margin: 0 0 4px; font-size: 15px; }
  .sel-date { color: var(--muted); font-size: 12.5px; margin-bottom: 10px; }
  .sec-label { font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 12px 0 6px; }
  .in-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .in-pill { background: var(--green-bg); color: var(--green); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; font-weight: 600; }
  .out-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 13.5px; }
  .out-row:last-child { border-bottom: none; }
  .out-row .who { font-weight: 600; }
  .out-row .meta { color: var(--muted); font-size: 11.5px; }
  .out-row .x { margin-left: auto; border: none; background: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 2px 6px; border-radius: 6px; }
  .out-row .x:hover { color: var(--red); background: #fbeaea; }
  .empty { color: var(--muted); font-size: 13px; }

  .hol-list { max-height: 160px; overflow: auto; }
  .hol-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
  .hol-row:last-child { border-bottom: none; }
  .hol-row .x { margin-left: auto; border: none; background: none; color: var(--muted); cursor: pointer; }
  .hol-row .x:hover { color: var(--red); }
  .hol-add { display: flex; gap: 6px; margin-top: 8px; }
  .hol-add input { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 12.5px; font-family: inherit; }
  .hol-add input[type=date] { width: 130px; }
  .hol-add input:not([type=date]) { flex: 1; min-width: 0; }
  .hol-add button { border: none; background: var(--accent); color: #fff; border-radius: 8px; padding: 6px 10px; font-size: 12.5px; font-weight: 600; cursor: pointer; }

  .modal-back { position: fixed; inset: 0; background: rgba(15,22,40,.45); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .modal-back.open { display: flex; }
  .modal { background: var(--card); border-radius: var(--radius); width: 400px; max-width: 100%; padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .modal h3 { margin: 0 0 14px; font-size: 16px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  .field input, .field select { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; font-family: inherit; background: #fbfcfe; }
  .field input:focus, .field select:focus { outline: 2px solid #bcd0fb; border-color: var(--accent); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .quick button { font-size: 11.5px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: #f6f8fc; cursor: pointer; }
  .quick button:hover { border-color: var(--accent); color: var(--accent); }
  .modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .err { color: var(--red); font-size: 12.5px; min-height: 16px; margin-top: 4px; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(80px); background: #1c2333; color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 13.5px; transition: transform .25s ease; z-index: 60; }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <h1>🗓️ ITeFM Attendance Tracker</h1>
  <span class="sub">Who is not in office</span>
  <span class="badge-live">● live</span>
  <div class="spacer"></div>
  <button class="btn" id="todayBtn">Today</button>
  <button class="btn primary" id="addBtn">+ Log leave / MC</button>
</header>

<div class="roster">
  <span class="label">Team</span>
  <span id="memberPills"></span>
  <form class="add-member" id="memberForm">
    <input id="memberName" placeholder="Add teammate…" maxlength="60">
    <button type="submit">+ Add</button>
  </form>
</div>

<main>
  <section class="card">
    <div class="cal-head">
      <button class="btn icon" id="prevBtn">‹</button>
      <h2 id="monthLabel"></h2>
      <button class="btn icon" id="nextBtn">›</button>
      <div class="spacer"></div>
      <span class="stat" id="monthStat"></span>
    </div>
    <div id="calWrap"></div>
  </section>

  <aside>
    <div class="card panel">
      <h3 id="selTitle">Day details</h3>
      <div class="sel-date" id="selDate"></div>
      <div id="selBody"></div>
    </div>
    <div class="card panel">
      <h3>Public holidays</h3>
      <div class="sel-date">Excluded from the calendar (non-work days)</div>
      <div class="hol-list" id="holList"></div>
      <form class="hol-add" id="holForm">
        <input type="date" id="holDate" required>
        <input id="holName" placeholder="Holiday name" maxlength="60">
        <button type="submit">+</button>
      </form>
    </div>
  </aside>
</main>

<div class="modal-back" id="modalBack">
  <form class="modal" id="leaveForm">
    <h3>Log leave / MC</h3>
    <div class="field">
      <label>Who is on leave?</label>
      <select id="fMember"></select>
    </div>
    <div class="field">
      <label>Leave type</label>
      <select id="fType"></select>
    </div>
    <div class="row2">
      <div class="field">
        <label>From</label>
        <input id="fStart" type="date" required>
      </div>
      <div class="field">
        <label>To</label>
        <input id="fEnd" type="date" required>
      </div>
    </div>
    <div class="quick">
      <button type="button" data-q="today">Today</button>
      <button type="button" data-q="tomorrow">Tomorrow</button>
      <button type="button" data-q="week">This week</button>
      <button type="button" data-q="3days">3 days</button>
    </div>
    <div class="field" style="margin-top:12px">
      <label>Note (optional)</label>
      <input id="fNote" maxlength="200" placeholder="e.g. MC until Friday">
    </div>
    <div class="err" id="formErr"></div>
    <div class="actions">
      <button type="button" class="btn" id="cancelBtn">Cancel</button>
      <button type="submit" class="btn primary">Submit</button>
    </div>
  </form>
</div>

<div class="toast" id="toast"></div>

<script>
let state = { members: [], entries: [], holidays: [], types: [] };
let viewYear, viewMonth;
let selected = toStr(new Date());

const $ = (id) => document.getElementById(id);
function pad(n) { return String(n).padStart(2, "0"); }
function toStr(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function parseStr(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW_LONG = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const PALETTE = ["#2f6fed","#e5484d","#8e4ec6","#e59407","#0ea5a4","#d6336c","#3e6b1f","#525fe5","#b54708","#0b7285","#a61e4d","#5f3dc4"];
function colorOf(memberId) {
  const idx = state.members.findIndex(m => m.id === memberId);
  return PALETTE[(idx === -1 ? 0 : idx) % PALETTE.length];
}
function holidayOn(ds) { return state.holidays.find(h => h.date === ds); }
function isWorkday(d) { const w = d.getDay(); if (w === 0 || w === 6) return false; return !holidayOn(toStr(d)); }
function leaveOn(ds) { return state.entries.filter(e => e.start <= ds && ds <= e.end); }
function outOn(ds) {
  const ids = new Set(leaveOn(ds).map(e => e.memberId));
  return state.members.filter(m => ids.has(m.id));
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || "Request failed");
  return data;
}

async function refresh() {
  try {
    state = await api("/api/state");
    render();
  } catch (e) { console.error(e); }
}

function render() {
  renderRoster();
  renderCalendar();
  renderSidebar();
  renderHolidays();
  const sel = $("fMember");
  const cur = sel.value;
  sel.innerHTML = state.members.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join("");
  if (state.members.some(m => m.id === cur)) sel.value = cur;
  $("fType").innerHTML = state.types.map(t => `<option>${t}</option>`).join("");
  $("addBtn").disabled = false;
}

function renderRoster() {
  $("memberPills").innerHTML = state.members.length
    ? state.members.map(m => `<span class="member-pill" style="background:${colorOf(m.id)}">${esc(m.name)}<button class="x" data-mem="${m.id}" title="Remove" style="color:#fff">✕</button></span>`).join(" ")
    : `<span class="empty" style="font-size:13px">No teammates yet — add everyone above. Everyone is in office by default.</span>`;
  $("memberPills").querySelectorAll("[data-mem]").forEach(b => b.addEventListener("click", async () => {
    const m = state.members.find(x => x.id === b.dataset.mem);
    if (!confirm("Remove " + m.name + " from the team? Their leave entries will also be removed.")) return;
    try { await api("/api/members/" + b.dataset.mem, { method: "DELETE" }); toast(m.name + " removed"); refresh(); }
    catch (e) { toast(e.message); }
  }));
}

function renderCalendar() {
  $("monthLabel").textContent = MONTHS[viewMonth] + " " + viewYear;
  const wrap = $("calWrap");

  if (!state.members.length) {
    wrap.innerHTML = `<div class="empty-hint">👋 Welcome! Add your team members in the bar above.<br>Everyone is <b>in office by default</b> — days will show who's <b>not coming in</b>.</div>`;
    return;
  }

  const dows = ["Mon","Tue","Wed","Thu","Fri"];
  let html = `<div class="grid">${dows.map(d => `<div class="dow">${d}</div>`).join("")}</div><div class="grid">`;

  const first = new Date(viewYear, viewMonth, 1);
  const last = new Date(viewYear, viewMonth + 1, 0);
  const weekStart = new Date(first);
  weekStart.setDate(1 - ((first.getDay() + 6) % 7));

  const todayStr = toStr(new Date());
  let absentDays = 0;

  while (weekStart <= last) {
    for (let j = 0; j < 5; j++) {
      const d = new Date(weekStart);
      d.setDate(weekStart.getDate() + j);
      const ds = toStr(d);

      if (d.getMonth() !== viewMonth) {
        html += `<div class="day" style="visibility:hidden"></div>`;
        continue;
      }

      const hol = holidayOn(ds);

      if (hol) {
        html += `<div class="day hol"><span class="num">${d.getDate()}</span>
          <span class="hol-label">🏖 ${esc(hol.name)}<br>Public holiday — office closed</span></div>`;
        continue;
      }

      const outMembers = outOn(ds);
      const count = outMembers.length;
      absentDays += count;
      const shown = outMembers.slice(0, 4);
      const chips = shown.map(m => {
        const e = leaveOn(ds).find(x => x.memberId === m.id);
        return `<span class="who-chip" style="background:${colorOf(m.id)}" title="${esc(m.name)} — ${esc(e ? e.type : "")}">${esc(m.name)} · ${esc(e ? shortType(e.type) : "")}</span>`;
      }).join("");
      const more = outMembers.length > 4 ? `<span class="more">+${outMembers.length - 4} more out</span>` : "";
      const badge = count === 0
        ? `<span class="incow-count ok">All in ✓</span>`
        : `<span class="incow-count warn">${count} out</span>`;
      html += `<div class="day${ds === todayStr ? " today" : ""}${ds === selected ? " selected" : ""}" data-date="${ds}">
        <span class="num">${d.getDate()}</span>
        ${badge}
        ${chips}${more}
      </div>`;
    }
    weekStart.setDate(weekStart.getDate() + 7);
  }
  html += "</div>";
  wrap.innerHTML = html;

  wrap.querySelectorAll(".day[data-date]").forEach(el =>
    el.addEventListener("click", () => { selected = el.dataset.date; render(); }));

  $("monthStat").innerHTML = `Team of <b>${state.members.length}</b> · <b>${absentDays}</b> out-of-office slots this month · weekends & holidays excluded`;
}

function shortType(t) {
  return { "MC": "MC", "Annual Leave": "AL", "Hospitalisation": "Hosp", "Childcare": "CC", "Unpaid Leave": "UL", "Going to site": "Site", "Other": "Oth" }[t] || t;
}

function renderSidebar() {
  const d = parseStr(selected);
  const ds = toStr(d);
  const hol = holidayOn(ds);
  const weekend = d.getDay() === 0 || d.getDay() === 6;
  const label = DOW_LONG[d.getDay()] + ", " + d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear();

  if (hol || weekend) {
    $("selTitle").textContent = "Day details";
    $("selDate").textContent = label;
    $("selBody").innerHTML = `<div class="empty">🏖 ${hol ? esc(hol.name) + " — public holiday" : "Weekend"} — not a work day, no one is expected in.</div>`;
    return;
  }

  $("selTitle").textContent = "Not in office";
  $("selDate").textContent = label;

  if (!state.members.length) {
    $("selBody").innerHTML = `<div class="empty">Add teammates at the top first.</div>`;
    return;
  }

  const outs = leaveOn(ds).sort((a,b) => a.name.localeCompare(b.name));

  let html;
  if (!outs.length) {
    html = `<div class="in-list"><span class="in-pill">✓ Everyone's in — nobody on leave</span></div>`;
  } else {
    html = outs.map(e => {
      const c = colorOf(e.memberId);
      return `
      <div class="out-row">
        <span class="dot" style="width:10px;height:10px;border-radius:50%;flex:none;background:${c}"></span>
        <span>
          <span class="who" style="color:${c}">${esc(e.name)}</span>
          <span class="meta"> · ${esc(e.type)}${eRange(e)}${e.note ? " · " + esc(e.note) : ""}</span>
        </span>
        <button class="x" title="Mark as back (remove leave)" data-del="${e.id}">✕</button>
      </div>`;
    }).join("");
  }
  $("selBody").innerHTML = html;
  $("selBody").querySelectorAll("[data-del]").forEach(b =>
    b.addEventListener("click", async () => {
      if (!confirm("Remove this leave entry?")) return;
      try { await api("/api/entries/" + b.dataset.del, { method: "DELETE" }); toast("Leave removed — they're back in!"); refresh(); }
      catch (e) { toast(e.message); }
    }));
}

function eRange(e) {
  if (e.start === e.end) return "";
  const en = parseStr(e.end);
  return " · until " + en.getDate() + " " + MONTHS[en.getMonth()].slice(0,3);
}

function renderHolidays() {
  const upcoming = [...state.holidays].sort((a,b) => a.date.localeCompare(b.date));
  $("holList").innerHTML = upcoming.length
    ? upcoming.map(h => `<div class="hol-row"><b>${h.date}</b>&nbsp;${esc(h.name)}<button class="x" data-hol="${h.id}" title="Remove">✕</button></div>`).join("")
    : `<div class="empty">No holidays added.</div>`;
  $("holList").querySelectorAll("[data-hol]").forEach(b =>
    b.addEventListener("click", async () => {
      try { await api("/api/holidays/" + b.dataset.hol, { method: "DELETE" }); toast("Holiday removed"); refresh(); }
      catch (e) { toast(e.message); }
    }));
}

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 2200);
}

$("prevBtn").addEventListener("click", () => { viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; } render(); });
$("nextBtn").addEventListener("click", () => { viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; } render(); });
$("todayBtn").addEventListener("click", () => { const n = new Date(); viewYear = n.getFullYear(); viewMonth = n.getMonth(); selected = toStr(n); render(); });

$("memberForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const name = $("memberName").value.trim();
  if (!name) return;
  try {
    await api("/api/members", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name }) });
    $("memberName").value = "";
    toast(name + " added to team ✓");
    refresh();
  } catch (e) { toast(e.message); }
});

$("holForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  try {
    await api("/api/holidays", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ date: $("holDate").value, name: $("holName").value }) });
    $("holDate").value = ""; $("holName").value = "";
    toast("Holiday added");
    refresh();
  } catch (e) { toast(e.message); }
});

const modal = $("modalBack");
$("addBtn").addEventListener("click", () => {
  if (!state.members.length) { toast("Add teammates first (top bar)"); return; }
  $("formErr").textContent = "";
  $("fStart").value = $("fEnd").value = selected;
  modal.classList.add("open");
  $("fMember").focus();
});
$("cancelBtn").addEventListener("click", () => modal.classList.remove("open"));
modal.addEventListener("click", (e) => { if (e.target === modal) modal.classList.remove("open"); });

document.querySelectorAll(".quick button").forEach(b => b.addEventListener("click", () => {
  const base = parseStr(selected);
  const t = new Date();
  let s = base, e2 = base;
  if (b.dataset.q === "today") { s = e2 = t; }
  if (b.dataset.q === "tomorrow") { s = e2 = new Date(t.getFullYear(), t.getMonth(), t.getDate() + 1); }
  if (b.dataset.q === "week") { const mon = new Date(t); mon.setDate(t.getDate() - ((t.getDay()+6)%7)); s = mon; e2 = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 4); }
  if (b.dataset.q === "3days") { s = base; e2 = new Date(base.getFullYear(), base.getMonth(), base.getDate() + 2); }
  $("fStart").value = toStr(s);
  $("fEnd").value = toStr(e2);
}));

$("leaveForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  $("formErr").textContent = "";
  try {
    const e = await api("/api/entries", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        memberId: $("fMember").value,
        type: $("fType").value,
        start: $("fStart").value,
        end: $("fEnd").value || $("fStart").value,
        note: $("fNote").value
      })
    });
    modal.classList.remove("open");
    $("fNote").value = "";
    const d = parseStr(e.start);
    viewYear = d.getFullYear(); viewMonth = d.getMonth();
    selected = e.start;
    toast(e.name + "'s leave logged ✓");
    refresh();
  } catch (err) {
    $("formErr").textContent = err.message;
  }
});

const n0 = new Date();
viewYear = n0.getFullYear();
viewMonth = n0.getMonth();
refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
