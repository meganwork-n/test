services:
  - type: web
    name: itefm-attendance-tracker
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /api/state
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: itefm-attendance-db
          property: connectionString

databases:
  - name: itefm-attendance-db
    plan: free
